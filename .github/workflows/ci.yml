name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.14"]
    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      SECRET_KEY: "ci-secret-key-for-testing-only-do-not-use-in-production"
    steps:
      - uses: actions/checkout@v4

      - name: Remove tracked .env to prevent leakage
        run: rm -f .env

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python }}

      - name: Verify lockfile
        run: uv lock --check

      - name: Sync dependencies
        run: uv sync --frozen --python ${{ matrix.python }}

      - name: Run tests
        run: uv run pytest -q -p no:cacheprovider

  ci-ok:
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: Verify test status
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test job failed or cancelled: ${{ needs.test.result }}"
            exit 1
          fi
          echo "all test matrix jobs succeeded"
