name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen --python 3.12

      - name: Ruff Check
        run: uv run ruff check .

      - name: Ruff Format Check
        run: uv run ruff format --check .

      - name: Mypy Type Check
        run: uv run mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.14"]
    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      SECRET_KEY: "ci-secret-key-for-testing-only-do-not-use-in-production"
    steps:
      - uses: actions/checkout@v4

      - name: Remove tracked .env to prevent leakage
        run: rm -f .env

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python }}

      - name: Verify lockfile
        run: uv lock --check

      - name: Sync dependencies
        run: uv sync --frozen --python ${{ matrix.python }}

      - name: Run tests
        run: uv run pytest -q -p no:cacheprovider

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: pip-audit (CVE scan)
        continue-on-error: true
        run: |
          uv export --frozen --no-emit-project --no-hashes -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --no-deps --disable-pip

  ci-ok:
    runs-on: ubuntu-latest
    needs: [lint, test, audit]
    if: always()
    steps:
      - name: Verify test status
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ]; then
            echo "CI checks failed: lint=${{ needs.lint.result }}, test=${{ needs.test.result }}"
            exit 1
          fi
          echo "all checks passed"
