id: fastiq
framework: fastapi
version: 1.0

paths:
  modules: app/modules
  models: app/models

generators:
  module:
    stub: stubs/module
    path: modules
    dest: "{{name_lower}}"
    registration:
      - type: marker
        target: app/main.py
        marker: "# pyartisan:module_imports"
        line: "from app.modules.{{name_lower}}.router import router as {{name_lower}}_router"
      - type: marker
        target: app/main.py
        marker: "# pyartisan:modules"
        line: "api_router.include_router({{name_lower}}_router)"
  model:
    stub: stubs/model
    path: models
    registration:
      type: import_list
      target: "{{path}}/__init__.py"

scripts:
  serve: "uv run uvicorn app.main:app --reload"
  analyze:
    - {name: ruff-check, cmd: "uv run ruff check .", fix: "uv run ruff check --fix ."}
    - {name: ruff-format, cmd: "uv run ruff format --check .", fix: "uv run ruff format ."}
    - {name: bandit, cmd: "uv run bandit -q -r app -c pyproject.toml"}
    - {name: mypy, cmd: "uv run mypy"}
